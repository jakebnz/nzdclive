name: Update live streams

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: pages
        uses: actions/configure-pages@v5

      - name: Find live streams
        run: python3 -I scripts/fetch_live.py site/live.json

      - name: Compare with deployed list
        id: compare
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if curl -fsS --max-time 20 "$BASE_URL/live.json?t=$(date +%s)" -o deployed.json \
             && cmp -s deployed.json site/live.json; then
            echo "No change since last deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
