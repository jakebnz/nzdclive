<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>NZDC Live (cropped)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; overflow: hidden;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #grid { position: fixed; inset: 0; display: flex; flex-wrap: wrap;
    justify-content: center; align-content: center; }
  .tile { position: relative; overflow: hidden; background: #000; }
  .tile iframe { position: absolute; top: 50%; left: 50%; border: 0;
    transform: translate(-50%, -50%); }
  #empty { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 16px; }
  #empty a { color: #8ab4f8; }
</style>
</head>
<body>
<div id="grid"></div>
<div id="empty">
  <div>
    <p id="empty-msg">Checking for live streams…</p>
    <p><a href="https://www.youtube.com/channel/UCuKowzPg2-A0FcmyPa3yWug/streams" rel="noopener noreferrer">Channel streams on YouTube</a></p>
  </div>
</div>
<script src="../app.js" data-mode="cropped" data-base="../"></script>
</body>
</html>
